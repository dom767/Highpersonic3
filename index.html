<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Audio Device Waveform Visualizer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --panel: #171a21;
      --border: #2a2f3a;
      --text: #f3f5f7;
      --muted: #9aa4b2;
      --accent: #4ea8ff;
      --accent-2: #7b68ee;
      --danger: #ff5d73;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top, #1a2030, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(960px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.4rem;
    }

    p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.4;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 10px;
      margin-bottom: 14px;
    }

    select,
    button {
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #12151d;
      color: var(--text);
      padding: 0 12px;
      font-size: 0.95rem;
    }

    button {
      cursor: pointer;
      transition: transform 0.08s ease, opacity 0.2s ease;
    }

    button:hover {
      opacity: 0.92;
    }

    button:active {
      transform: translateY(1px);
    }

    #start-btn {
      border-color: #2e537a;
      background: linear-gradient(135deg, #23598d, #2d72b8);
    }

    #stop-btn {
      border-color: #7a2e3f;
      background: linear-gradient(135deg, #6e2433, #9b3148);
    }

    #refresh-btn {
      border-color: #4b416e;
      background: linear-gradient(135deg, #433a60, #5b4f86);
    }

    canvas {
      display: block;
      width: 100%;
      height: 280px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #0d1016;
    }

    #fft-canvas {
      margin-top: 10px;
      height: 220px;
    }

    .status {
      margin-top: 10px;
      min-height: 20px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .status.error {
      color: var(--danger);
    }

    code {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      padding: 2px 6px;
    }

    @media (max-width: 820px) {
      .controls {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Audio Waveform Visualizer</h1>
    <p>
      Select an audio input and click <strong>Start</strong>. To visualize Spotify/system playback,
      route audio into a capture device (for example Stereo Mix or a virtual audio cable).
    </p>

    <div class="controls">
      <select id="device-select" aria-label="Audio input device"></select>
      <button id="refresh-btn" type="button">Refresh Devices</button>
      <button id="start-btn" type="button">Start</button>
      <button id="stop-btn" type="button">Stop</button>
    </div>

    <canvas id="waveform-canvas" width="920" height="280"></canvas>
    <canvas id="fft-canvas" width="920" height="220"></canvas>
    <div id="status" class="status">Ready.</div>
  </main>

  <script src="audiocore.js"></script>
  <script>
    const deviceSelect = document.getElementById("device-select");
    const startBtn = document.getElementById("start-btn");
    const stopBtn = document.getElementById("stop-btn");
    const refreshBtn = document.getElementById("refresh-btn");
    const statusEl = document.getElementById("status");
    const waveformCanvas = document.getElementById("waveform-canvas");
    const waveformCtx = waveformCanvas.getContext("2d");
    const fftCanvas = document.getElementById("fft-canvas");
    const fftCtx = fftCanvas.getContext("2d");
    const TAB_CAPTURE_VALUE = "__tab_capture__";

    const audioCore = new AudioCore({ frameSize: 576, fftSize: 2048, smoothingTimeConstant: 0 });
    let mediaStream = null;
    let animationFrameId = null;
    let hasValidDevice = false;

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.classList.toggle("error", isError);
    }

    async function withDevicePermission() {
      // Device labels are empty until the page gets audio permission once.
      const tempStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      AudioCore.stopTracks(tempStream);
    }

    async function populateDevices() {
      setStatus("Scanning audio input devices...");
      const devices = await navigator.mediaDevices.enumerateDevices();
      const inputs = devices.filter((device) => device.kind === "audioinput");

      deviceSelect.innerHTML = "";
      hasValidDevice = false;
      startBtn.disabled = true;

      const tabCaptureOption = document.createElement("option");
      tabCaptureOption.value = TAB_CAPTURE_VALUE;
      tabCaptureOption.textContent = "Tab Audio (share picker)";
      deviceSelect.appendChild(tabCaptureOption);

      if (!inputs.length) {
        deviceSelect.selectedIndex = 0;
        hasValidDevice = true;
        startBtn.disabled = false;
        setStatus("No audio input devices were detected. You can still use 'Tab Audio (share picker)' to capture Spotify/web audio.", false);
        return;
      }

      inputs.forEach((device, index) => {
        const option = document.createElement("option");
        option.value = device.deviceId;
        option.textContent = device.label || "Input Device " + (index + 1);
        deviceSelect.appendChild(option);
      });

      deviceSelect.selectedIndex = 0;
      hasValidDevice = true;
      startBtn.disabled = false;
      setStatus("Found " + inputs.length + " audio input device(s).");
    }

    function clearCanvas() {
      waveformCtx.clearRect(0, 0, waveformCanvas.width, waveformCanvas.height);
      waveformCtx.fillStyle = "#0d1016";
      waveformCtx.fillRect(0, 0, waveformCanvas.width, waveformCanvas.height);

      fftCtx.clearRect(0, 0, fftCanvas.width, fftCanvas.height);
      fftCtx.fillStyle = "#0d1016";
      fftCtx.fillRect(0, 0, fftCanvas.width, fftCanvas.height);
    }

    function drawWaveformAndFft() {
      const frame = audioCore.getFrame();
      if (!frame) return;

      const timeData = frame.waveformData[0];
      const spectrumData = frame.spectrumData[0];
      const timeBufferLength = timeData.length;

      clearCanvas();

      waveformCtx.lineWidth = 2;
      waveformCtx.strokeStyle = "#4ea8ff";
      waveformCtx.shadowBlur = 16;
      waveformCtx.shadowColor = "#4ea8ff";
      waveformCtx.beginPath();

      const sliceWidth = waveformCanvas.width / timeBufferLength;
      let x = 0;

      for (let i = 0; i < timeBufferLength; i++) {
        const normalized = (timeData[i] + 1) / 2;
        const y = normalized * waveformCanvas.height;

        if (i === 0) {
          waveformCtx.moveTo(x, y);
        } else {
          waveformCtx.lineTo(x, y);
        }
        x += sliceWidth;
      }

      waveformCtx.lineTo(waveformCanvas.width, waveformCanvas.height / 2);
      waveformCtx.stroke();
      waveformCtx.shadowBlur = 0;

      const barCount = 96;
      const barWidth = fftCanvas.width / barCount;
      const binsPerBar = Math.max(1, Math.floor(spectrumData.length / barCount));

      for (let barIndex = 0; barIndex < barCount; barIndex++) {
        const start = barIndex * binsPerBar;
        const end = Math.min(spectrumData.length, start + binsPerBar);
        let peak = 0;

        for (let i = start; i < end; i++) {
          peak = Math.max(peak, spectrumData[i]);
        }

        const magnitude = peak;
        const barHeight = Math.max(2, magnitude * (fftCanvas.height - 20));
        const drawX = barIndex * barWidth;
        const drawY = fftCanvas.height - barHeight;
        const hue = 210 + Math.round((barIndex / barCount) * 70);

        fftCtx.fillStyle = "hsl(" + hue + " 85% 60%)";
        fftCtx.fillRect(drawX, drawY, Math.max(1, barWidth - 2), barHeight);
      }

      animationFrameId = requestAnimationFrame(drawWaveformAndFft);
    }

    async function stopVisualizer() {
      if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }

      await audioCore.stop();
      mediaStream = null;
      clearCanvas();
      setStatus("Stopped.");
    }

    async function startVisualizer() {
      try {
        if (!hasValidDevice || !deviceSelect.value) {
          setStatus("No valid input is selected. Grant microphone permission, choose a listed device, or click Refresh Devices.", true);
          return;
        }

        if (deviceSelect.value === TAB_CAPTURE_VALUE) {
          await startTabAudioVisualizer();
          return;
        }

        await stopVisualizer();

        mediaStream = await audioCore.startFromDevice(deviceSelect.value);

        const chosenName = deviceSelect.options[deviceSelect.selectedIndex]?.text || "Selected input";
        setStatus("Streaming from " + chosenName + ".");
        drawWaveformAndFft();
      } catch (error) {
        setStatus("Could not start audio capture: " + (error.message || String(error)), true);
      }
    }

    async function startTabAudioVisualizer() {
      try {
        await stopVisualizer();

        if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
          setStatus("Tab/system capture is not supported in this browser.", true);
          return;
        }

        mediaStream = await audioCore.startFromDisplay();

        const hasAudioTrack = mediaStream.getAudioTracks().length > 0;
        if (!hasAudioTrack) {
          AudioCore.stopTracks(mediaStream);
          mediaStream = null;
          await audioCore.stop();
          setStatus("No audio track was shared. In the picker, choose a tab/window and enable Share tab audio.", true);
          return;
        }

        const [audioTrack] = mediaStream.getAudioTracks();
        audioTrack.addEventListener("ended", () => {
          stopVisualizer().catch(() => {});
          setStatus("Tab capture ended.");
        });

        setStatus("Capturing shared tab/window audio.");
        drawWaveformAndFft();
      } catch (error) {
        setStatus("Could not start tab capture: " + (error.message || String(error)), true);
      }
    }

    refreshBtn.addEventListener("click", async () => {
      try {
        await populateDevices();
      } catch (error) {
        setStatus("Device refresh failed: " + (error.message || String(error)), true);
      }
    });

    startBtn.addEventListener("click", startVisualizer);
    deviceSelect.addEventListener("change", () => {
      const valid = !!deviceSelect.value;
      hasValidDevice = valid;
      startBtn.disabled = !valid;
      if (deviceSelect.value === TAB_CAPTURE_VALUE) {
        setStatus("Ready for tab capture. Click Start, then choose a tab/window and enable Share audio.");
      }
    });
    stopBtn.addEventListener("click", () => {
      stopVisualizer().catch((error) =>
        setStatus("Stop failed: " + (error.message || String(error)), true)
      );
    });

    window.addEventListener("beforeunload", () => {
      AudioCore.stopTracks(mediaStream);
    });

    (async () => {
      clearCanvas();
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setStatus("This browser does not support audio capture APIs.", true);
          return;
        }
        await withDevicePermission();
        await populateDevices();
      } catch (error) {
        startBtn.disabled = true;
        setStatus("Audio permission/setup failed: " + (error.message || String(error)) + ". Serve this page over http://localhost or https and allow microphone access.", true);
      }
    })();
  </script>
</body>
</html>
