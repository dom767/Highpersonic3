<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Highpersonic3 Audio Visualizer</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f3ff;
      --bg-2: #eef2ff;
      --panel: rgba(255, 255, 255, 0.78);
      --border: rgba(120, 110, 160, 0.25);
      --text: #2d2640;
      --muted: #6b6385;
      --accent: #8aa6ff;
      --accent-2: #c7a3e8;
      --danger: #d4607a;
      --thumb-bg: rgba(255, 255, 255, 0.85);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, var(--bg), var(--bg-2));
      color: var(--text);
    }

    #viz3d-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 0;
    }

    .top-overlay,
    .bottom-overlay {
      position: fixed;
      left: 0;
      right: 0;
      z-index: 2;
      padding: 14px 18px;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .top-overlay { top: 0; }
    .bottom-overlay { bottom: 0; }

    .panel {
      pointer-events: auto;
      background: var(--panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(80, 70, 130, 0.12);
      padding: 12px 14px;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(220px, 320px) auto auto auto;
      gap: 10px;
      align-items: center;
    }

    .tuning {
      display: flex;
      gap: 14px;
      align-items: end;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .tuning-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 110px;
    }

    .tuning-item label {
      font-size: 0.66rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .tuning-item label span {
      font-variant-numeric: tabular-nums;
      color: var(--text);
      font-weight: 500;
      letter-spacing: 0;
      text-transform: none;
    }

    .tuning-item input[type="range"] {
      width: 100%;
      accent-color: var(--accent-2);
    }

    select,
    button {
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.85);
      color: var(--text);
      padding: 0 12px;
      font-size: 0.92rem;
      transition: background 0.2s ease, transform 0.08s ease, box-shadow 0.2s ease;
    }

    button {
      cursor: pointer;
      font-weight: 500;
    }

    button:hover { background: rgba(255, 255, 255, 1); }
    button:active { transform: translateY(1px); }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    #start-btn {
      border-color: rgba(120, 150, 220, 0.5);
      background: linear-gradient(135deg, #d8e3ff, #ecd6f5);
      color: #2c2a55;
    }

    #stop-btn {
      border-color: rgba(220, 140, 160, 0.45);
      background: linear-gradient(135deg, #ffd9e4, #f8d7d0);
      color: #5e2740;
    }

    #refresh-btn {
      background: linear-gradient(135deg, #e7e1ff, #d8f1ff);
      color: #36306a;
    }

    .bottom-overlay .panel {
      display: flex;
      gap: 14px;
      align-items: stretch;
    }

    .thumb-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .thumb-label {
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .thumb {
      display: block;
      width: 320px;
      height: 80px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--thumb-bg);
    }

    #status {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      pointer-events: none;
      background: rgba(255, 255, 255, 0.7);
      color: var(--muted);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 0.78rem;
      border: 1px solid var(--border);
      max-width: 80vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #status.error { color: var(--danger); }

    #debug-readout {
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 4;
      min-width: 240px;
      max-width: 340px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 10px;
      color: var(--muted);
      font-size: 0.73rem;
      line-height: 1.35;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      white-space: pre-wrap;
      pointer-events: auto;
      user-select: text;
    }

    #debug-controls {
      position: fixed;
      right: 12px;
      bottom: 190px;
      z-index: 5;
      display: flex;
      gap: 6px;
    }

    .debug-btn {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.9);
      color: var(--text);
      border-radius: 8px;
      height: 28px;
      padding: 0 10px;
      font-size: 0.72rem;
      cursor: pointer;
    }

    #webgpu-warning {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      background: var(--panel);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 22px;
      max-width: 460px;
      text-align: center;
      color: var(--muted);
      box-shadow: 0 10px 28px rgba(80, 70, 130, 0.12);
      display: none;
    }

    #webgpu-warning strong { color: var(--text); }

    @media (max-width: 760px) {
      .controls {
        grid-template-columns: 1fr 1fr;
      }
      .tuning {
        flex-wrap: wrap;
      }
      .tuning-item {
        min-width: 140px;
        flex: 1 1 140px;
      }
      .thumb { width: 200px; }
      .bottom-overlay .panel { flex-direction: column; }
    }
  </style>
</head>
<body>
  <canvas id="viz3d-canvas"></canvas>

  <div id="webgpu-warning">
    <strong>3D visualization unavailable</strong>
    <p style="margin: 8px 0 0;">
      Your browser does not expose WebGPU on this page.
      Try a recent Chrome or Edge over <code>http://localhost</code> or <code>https://</code>.
      Audio capture and the waveform/FFT thumbnails will still work.
    </p>
  </div>

  <div class="top-overlay">
    <div class="panel">
      <div class="controls">
        <select id="device-select" aria-label="Audio input device"></select>
        <button id="refresh-btn" type="button">Refresh</button>
        <button id="start-btn" type="button">Start</button>
        <button id="stop-btn" type="button">Stop</button>
      </div>
      <div class="tuning">
        <div class="tuning-item">
          <label for="gamma-slider">Gamma <span id="gamma-value">0.70</span></label>
          <input id="gamma-slider" type="range" min="0.3" max="1.5" step="0.05" value="0.7" />
        </div>
        <div class="tuning-item">
          <label for="tilt-slider">Tilt <span id="tilt-value">1.00</span></label>
          <input id="tilt-slider" type="range" min="0" max="2" step="0.05" value="1.0" />
        </div>
        <div class="tuning-item">
          <label for="floor-slider">Floor <span id="floor-value">0.05</span></label>
          <input id="floor-slider" type="range" min="0" max="0.5" step="0.01" value="0.05" />
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-overlay">
    <div class="panel">
      <div class="thumb-block">
        <span class="thumb-label">Waveform</span>
        <canvas id="waveform-canvas" class="thumb" width="640" height="160"></canvas>
      </div>
      <div class="thumb-block">
        <span class="thumb-label">Spectrum</span>
        <canvas id="fft-canvas" class="thumb" width="640" height="160"></canvas>
      </div>
    </div>
  </div>

  <div id="status">Ready.</div>
  <div id="debug-controls">
    <button id="debug-freeze-btn" class="debug-btn" type="button">Freeze: Off</button>
    <button id="debug-copy-btn" class="debug-btn" type="button">Copy Debug</button>
  </div>
  <div id="debug-readout">debug: idle</div>

  <script src="audiocore.js"></script>
  <script src="camera.js"></script>
  <script src="gridrenderer.js"></script>
  <script src="solidcolorbackground.js"></script>
  <script src="visualizer3d.js"></script>
  <script>
    const deviceSelect = document.getElementById("device-select");
    const startBtn = document.getElementById("start-btn");
    const stopBtn = document.getElementById("stop-btn");
    const refreshBtn = document.getElementById("refresh-btn");
    const statusEl = document.getElementById("status");
    const waveformCanvas = document.getElementById("waveform-canvas");
    const waveformCtx = waveformCanvas.getContext("2d");
    const fftCanvas = document.getElementById("fft-canvas");
    const fftCtx = fftCanvas.getContext("2d");
    const viz3dCanvas = document.getElementById("viz3d-canvas");
    const webgpuWarning = document.getElementById("webgpu-warning");
    const debugFreezeBtn = document.getElementById("debug-freeze-btn");
    const debugCopyBtn = document.getElementById("debug-copy-btn");
    const debugReadout = document.getElementById("debug-readout");
    const gammaSlider = document.getElementById("gamma-slider");
    const tiltSlider = document.getElementById("tilt-slider");
    const floorSlider = document.getElementById("floor-slider");
    const gammaValue = document.getElementById("gamma-value");
    const tiltValue = document.getElementById("tilt-value");
    const floorValue = document.getElementById("floor-value");
    const TAB_CAPTURE_VALUE = "__tab_capture__";
    const SPECTRUM_SETTINGS_KEY = "highpersonic3.spectrumSettings";
    const SPECTRUM_DEFAULTS = { gamma: 0.7, tilt: 1.0, floor: 0.05 };

    const audioCore = new AudioCore({ frameSize: 576, fftSize: 2048, smoothingTimeConstant: 0 });
    const visualizer3d = new Visualizer3D();
    const spectrumSettings = { ...SPECTRUM_DEFAULTS };

    function clampValue(value, fallback, slider) {
      const num = typeof value === "number" ? value : Number(value);
      if (!Number.isFinite(num)) return fallback;
      const min = Number(slider.min);
      const max = Number(slider.max);
      return Math.min(max, Math.max(min, num));
    }

    function loadSpectrumSettings() {
      try {
        const raw = localStorage.getItem(SPECTRUM_SETTINGS_KEY);
        if (!raw) return { ...SPECTRUM_DEFAULTS };
        const parsed = JSON.parse(raw);
        return {
          gamma: clampValue(parsed.gamma, SPECTRUM_DEFAULTS.gamma, gammaSlider),
          tilt: clampValue(parsed.tilt, SPECTRUM_DEFAULTS.tilt, tiltSlider),
          floor: clampValue(parsed.floor, SPECTRUM_DEFAULTS.floor, floorSlider)
        };
      } catch (err) {
        return { ...SPECTRUM_DEFAULTS };
      }
    }

    function saveSpectrumSettings(settings) {
      try {
        localStorage.setItem(SPECTRUM_SETTINGS_KEY, JSON.stringify(settings));
      } catch (err) {
        // Ignore quota/permission errors so the UI keeps working.
      }
    }

    function applySpectrumSettingsToUI(settings) {
      gammaSlider.value = String(settings.gamma);
      tiltSlider.value = String(settings.tilt);
      floorSlider.value = String(settings.floor);
      gammaValue.textContent = settings.gamma.toFixed(2);
      tiltValue.textContent = settings.tilt.toFixed(2);
      floorValue.textContent = settings.floor.toFixed(2);
    }

    function pushSpectrumSettings() {
      visualizer3d.setSpectrumSettings(spectrumSettings);
    }

    function bindSpectrumSlider(slider, valueEl, key, decimals) {
      slider.addEventListener("input", () => {
        const num = Number(slider.value);
        if (!Number.isFinite(num)) return;
        spectrumSettings[key] = num;
        valueEl.textContent = num.toFixed(decimals);
        pushSpectrumSettings();
        saveSpectrumSettings(spectrumSettings);
      });
    }

    Object.assign(spectrumSettings, loadSpectrumSettings());
    applySpectrumSettingsToUI(spectrumSettings);
    bindSpectrumSlider(gammaSlider, gammaValue, "gamma", 2);
    bindSpectrumSlider(tiltSlider, tiltValue, "tilt", 2);
    bindSpectrumSlider(floorSlider, floorValue, "floor", 2);

    let mediaStream = null;
    let animationFrameId = null;
    let hasValidDevice = false;
    let viz3dReady = false;
    let debugLastFrameMs = 0;
    let debugFps = 0;
    let debugFrozen = false;
    const debugEvents = [];

    function addDebugEvent(label, details = "") {
      const stamp = new Date().toLocaleTimeString();
      const line = "[" + stamp + "] " + label + (details ? " | " + details : "");
      debugEvents.push(line);
      if (debugEvents.length > 6) debugEvents.shift();
    }

    function updateDebugReadout(frame) {
      if (debugFrozen) return;
      if (!frame) {
        debugReadout.textContent = "debug: no frame";
        return;
      }

      const now = performance.now();
      if (debugLastFrameMs > 0) {
        const dt = now - debugLastFrameMs;
        const instantFps = dt > 0 ? 1000 / dt : 0;
        debugFps = debugFps > 0 ? (debugFps * 0.8 + instantFps * 0.2) : instantFps;
      }
      debugLastFrameMs = now;

      const spectrum = frame.spectrumData && frame.spectrumData[0] ? frame.spectrumData[0] : null;
      let bins = "n/a";
      if (spectrum && spectrum.length >= 6) {
        bins = [
          spectrum[0],
          spectrum[1],
          spectrum[2],
          spectrum[3],
          spectrum[4],
          spectrum[5]
        ].map((v) => Number(v).toFixed(3)).join(", ");
      }

      debugReadout.textContent =
        "mode: " + (frame.spectrumMode || "unknown") + "\n" +
        "fps: " + debugFps.toFixed(1) + "\n" +
        "sr: " + Math.round(frame.sRate || 0) + " Hz\n" +
        "ctx: " + (frame.contextState || "unknown") + "\n" +
        "cap: " + Math.round(frame.cappedMaxHz || 0) + " Hz\n" +
        "maxIdx: " + (frame.maxFreqIndex ?? -1) + "\n" +
        "bytePeak: " + Number(frame.bytePeak || 0).toFixed(1) + "\n" +
        "track: " + (frame.trackCount || 0) +
          " en=" + (frame.trackEnabled ? "1" : "0") +
          " mut=" + (frame.trackMuted ? "1" : "0") +
          " rs=" + (frame.trackReadyState || "n/a") + "\n" +
        "bins[0..5]: " + bins + "\n" +
        "events:\n" + (debugEvents.length ? debugEvents.join("\n") : "(none)");
    }

    debugFreezeBtn.addEventListener("click", () => {
      debugFrozen = !debugFrozen;
      debugFreezeBtn.textContent = "Freeze: " + (debugFrozen ? "On" : "Off");
    });

    debugCopyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(debugReadout.textContent || "");
        addDebugEvent("debug-copied");
      } catch (error) {
        addDebugEvent("debug-copy-failed", error.message || String(error));
      }
    });

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.classList.toggle("error", isError);
    }

    async function withDevicePermission() {
      addDebugEvent("permission-request", "getUserMedia(audio)");
      const tempStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      AudioCore.stopTracks(tempStream);
      addDebugEvent("permission-granted");
    }

    async function populateDevices() {
      setStatus("Scanning audio input devices...");
      const devices = await navigator.mediaDevices.enumerateDevices();
      const inputs = devices.filter((device) => device.kind === "audioinput");

      deviceSelect.innerHTML = "";
      hasValidDevice = false;
      startBtn.disabled = true;

      const tabCaptureOption = document.createElement("option");
      tabCaptureOption.value = TAB_CAPTURE_VALUE;
      tabCaptureOption.textContent = "Tab Audio (share picker)";
      deviceSelect.appendChild(tabCaptureOption);

      if (!inputs.length) {
        deviceSelect.selectedIndex = 0;
        hasValidDevice = true;
        startBtn.disabled = false;
        setStatus("No audio input devices were detected. You can still use 'Tab Audio (share picker)' to capture Spotify/web audio.");
        return;
      }

      inputs.forEach((device, index) => {
        const option = document.createElement("option");
        option.value = device.deviceId;
        option.textContent = device.label || "Input Device " + (index + 1);
        deviceSelect.appendChild(option);
      });

      deviceSelect.selectedIndex = 0;
      hasValidDevice = true;
      startBtn.disabled = false;
      setStatus("Found " + inputs.length + " audio input device(s).");
    }

    function clearThumbnails() {
      waveformCtx.clearRect(0, 0, waveformCanvas.width, waveformCanvas.height);
      fftCtx.clearRect(0, 0, fftCanvas.width, fftCanvas.height);
    }

    function drawWaveformThumb(timeData) {
      const w = waveformCanvas.width;
      const h = waveformCanvas.height;

      waveformCtx.fillStyle = "rgba(255,255,255,0.92)";
      waveformCtx.fillRect(0, 0, w, h);

      waveformCtx.strokeStyle = "rgba(120, 130, 200, 0.35)";
      waveformCtx.beginPath();
      waveformCtx.moveTo(0, h / 2);
      waveformCtx.lineTo(w, h / 2);
      waveformCtx.stroke();

      waveformCtx.lineWidth = 1.6;
      waveformCtx.strokeStyle = "#5d70c7";
      waveformCtx.beginPath();
      const slice = w / timeData.length;
      let x = 0;
      for (let i = 0; i < timeData.length; i++) {
        const y = ((timeData[i] + 1) / 2) * h;
        if (i === 0) waveformCtx.moveTo(x, y);
        else waveformCtx.lineTo(x, y);
        x += slice;
      }
      waveformCtx.stroke();
    }

    function drawFftThumb(spectrumData) {
      const w = fftCanvas.width;
      const h = fftCanvas.height;

      fftCtx.fillStyle = "rgba(255,255,255,0.92)";
      fftCtx.fillRect(0, 0, w, h);

      const barCount = 64;
      const binsPerBar = Math.max(1, Math.floor(spectrumData.length / barCount));
      const barWidth = w / barCount;

      for (let i = 0; i < barCount; i++) {
        let peak = 0;
        const start = i * binsPerBar;
        const end = Math.min(spectrumData.length, start + binsPerBar);
        for (let j = start; j < end; j++) {
          if (spectrumData[j] > peak) peak = spectrumData[j];
        }
        const barH = Math.max(1, peak * (h - 4));
        const x = i * barWidth;
        const y = h - barH;
        const t = i / barCount;
        const r = Math.round(120 + t * 90);
        const g = Math.round(120 + (1 - t) * 60);
        const b = Math.round(200 + t * 30);
        fftCtx.fillStyle = "rgb(" + r + "," + g + "," + b + ")";
        fftCtx.fillRect(x, y, Math.max(1, barWidth - 1), barH);
      }
    }

    function frameLoop() {
      try {
        const frame = audioCore.getFrame();
        if (frame) {
          drawWaveformThumb(frame.waveformData[0]);
          drawFftThumb(frame.spectrumData[0]);
          updateDebugReadout(frame);
          if (viz3dReady) {
            visualizer3d.pushSpectrum(frame.spectrumData[0]);
          }
        }
      } catch (error) {
        addDebugEvent("frame-error", error.message || String(error));
        debugReadout.textContent = "frameLoop error:\n" + (error.message || String(error));
      }
      animationFrameId = requestAnimationFrame(frameLoop);
    }

    async function stopVisualizer() {
      if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }
      await audioCore.stop();
      mediaStream = null;
      if (viz3dReady) visualizer3d.clearHistory();
      clearThumbnails();
      debugLastFrameMs = 0;
      debugFps = 0;
      addDebugEvent("capture-stopped");
      debugReadout.textContent = "debug: stopped";
      setStatus("Stopped.");
    }

    async function startVisualizer() {
      try {
        if (!hasValidDevice || !deviceSelect.value) {
          setStatus("No valid input is selected. Grant microphone permission, choose a listed device, or click Refresh.", true);
          return;
        }

        if (deviceSelect.value === TAB_CAPTURE_VALUE) {
          await startTabAudioVisualizer();
          return;
        }

        await stopVisualizer();
        addDebugEvent("capture-start", "device");
        mediaStream = await audioCore.startFromDevice(deviceSelect.value);

        const chosenName = deviceSelect.options[deviceSelect.selectedIndex]?.text || "Selected input";
        setStatus("Streaming from " + chosenName + ".");
        addDebugEvent("capture-running", chosenName);
        frameLoop();
      } catch (error) {
        addDebugEvent("capture-error", error.message || String(error));
        setStatus("Could not start audio capture: " + (error.message || String(error)), true);
      }
    }

    async function startTabAudioVisualizer() {
      try {
        await stopVisualizer();

        if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
          setStatus("Tab/system capture is not supported in this browser.", true);
          return;
        }

        addDebugEvent("capture-start", "tab");
        mediaStream = await audioCore.startFromDisplay();

        const hasAudioTrack = mediaStream.getAudioTracks().length > 0;
        if (!hasAudioTrack) {
          AudioCore.stopTracks(mediaStream);
          mediaStream = null;
          await audioCore.stop();
          setStatus("No audio track was shared. In the picker, choose a tab/window and enable Share tab audio.", true);
          return;
        }

        const [audioTrack] = mediaStream.getAudioTracks();
        audioTrack.addEventListener("ended", () => {
          stopVisualizer().catch(() => {});
          addDebugEvent("tab-ended");
          setStatus("Tab capture ended.");
        });

        setStatus("Capturing shared tab/window audio.");
        addDebugEvent("capture-running", "tab");
        frameLoop();
      } catch (error) {
        addDebugEvent("capture-error", error.message || String(error));
        setStatus("Could not start tab capture: " + (error.message || String(error)), true);
      }
    }

    refreshBtn.addEventListener("click", async () => {
      try {
        await populateDevices();
      } catch (error) {
        setStatus("Device refresh failed: " + (error.message || String(error)), true);
      }
    });

    startBtn.addEventListener("click", startVisualizer);
    deviceSelect.addEventListener("change", () => {
      const valid = !!deviceSelect.value;
      hasValidDevice = valid;
      startBtn.disabled = !valid;
      if (deviceSelect.value === TAB_CAPTURE_VALUE) {
        setStatus("Ready for tab capture. Click Start, then choose a tab/window and enable Share audio.");
      }
    });
    stopBtn.addEventListener("click", () => {
      stopVisualizer().catch((error) =>
        setStatus("Stop failed: " + (error.message || String(error)), true)
      );
    });

    window.addEventListener("beforeunload", () => {
      AudioCore.stopTracks(mediaStream);
    });

    async function initVisualizer3d() {
      if (!Visualizer3D.isSupported()) {
        addDebugEvent("webgpu-unsupported");
        webgpuWarning.style.display = "block";
        return;
      }
      try {
        viz3dReady = await visualizer3d.init(viz3dCanvas);
        if (!viz3dReady) {
          addDebugEvent("webgpu-init-failed");
          webgpuWarning.style.display = "block";
          return;
        }
        addDebugEvent("webgpu-init-ok");
        pushSpectrumSettings();
        visualizer3d.start();
      } catch (err) {
        addDebugEvent("webgpu-exception", err.message || String(err));
        viz3dReady = false;
        webgpuWarning.style.display = "block";
      }
    }

    (async () => {
      addDebugEvent("boot");
      clearThumbnails();
      await initVisualizer3d();
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setStatus("This browser does not support audio capture APIs.", true);
          return;
        }
        await withDevicePermission();
        await populateDevices();
      } catch (error) {
        startBtn.disabled = true;
        setStatus("Audio permission/setup failed: " + (error.message || String(error)) + ". Serve this page over http://localhost or https and allow microphone access.", true);
      }
    })();
  </script>
</body>
</html>
